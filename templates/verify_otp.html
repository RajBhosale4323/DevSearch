{% extends "base.html" %}
{% block title %}Verify OTP - DevSearch{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4 shadow-lg border-primary">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-dark">Verify Email</h1>
                <p class="text-secondary small">Enter the 6-digit code sent to your email.</p>
            </div>
            
            <form id="otpForm" method="POST" action="/verify_otp">
                <div class="d-flex justify-content-between mb-4">
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required autofocus>
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required>
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required>
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required>
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required>
                    <input type="text" maxlength="1" class="form-control text-center fs-1 fw-bold mx-1 otp-input" style="width: 60px; height: 75px; border: 3px solid #1d4ed8;" required>
                </div>
                <input type="hidden" name="otp" id="fullOtp">
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Verify & Join</button>
            </form>
        </div>
    </div>
</div>

<script>
const inputs = document.querySelectorAll('.otp-input');
const form = document.getElementById('otpForm');
const fullOtp = document.getElementById('fullOtp');

inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
        updateFullOtp();
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
        }
    });
});

function updateFullOtp() {
    let otpValue = '';
    inputs.forEach(input => otpValue += input.value);
    fullOtp.value = otpValue;
    if (otpValue.length === 6) {
        form.submit();
    }
}
</script>
{% endblock %}
