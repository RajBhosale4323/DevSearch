<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevSearch{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->\n    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Devicon & FontAwesome for real language icons -->
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS Module -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-success" href="/">⚡ DevSearch</a>
            <div class="d-flex align-items-center gap-3">
                {% if session.get('user') %}
                    <span class="text-white-50 small">👤 <strong class="text-white">{{ session['user'] }}</strong></span>
                    {% if session.get('language') %}
                    <a href="/{{ session['language'] }}" class="badge bg-success bg-opacity-25 text-success border border-success text-decoration-none p-2">Lang: {{ session['language'] | capitalize }}</a>
                    <a href="/languages" class="small text-info text-decoration-underline">Change</a>
                    {% endif %}
                    <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-success btn-sm">Login</a>
                    <a href="/register" class="btn btn-success btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1" style="max-width: 900px;">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 small">
        DevSearch &mdash; Instant Code Syntax & Reference Engine
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
