{% extends "base.html" %}

{% block title %}Add Syntax - DevSearch{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8">
        <form method="POST" action="/add" class="card p-4 shadow-sm">
            <h1 class="h4 mb-3 fw-bold text-dark">Add New Syntax</h1>
            
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="mb-3">
                <label for="syntax" class="form-label">Syntax</label>
                <textarea class="form-control" id="syntax" name="syntax" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label for="example" class="form-label">Example</label>
                <textarea class="form-control" id="example" name="example" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="tags" class="form-label">Tags</label>
                <input type="text" class="form-control" id="tags" name="tags" placeholder="Comma-separated tags">
            </div>

            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
