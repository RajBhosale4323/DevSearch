{% extends "base.html" %}
{% block title %}Register - DevSearch{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-lg border-secondary">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-dark">Create Account</h1>
                <p class="text-secondary small">Register to start using DevSearch</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label text-muted small text-uppercase fw-bold">Username</label>
                    <input type="text" name="username" required placeholder="Choose a username" 
                           class="form-control py-2" autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small text-uppercase fw-bold">Password (min 6 chars)</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="form-control py-2">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mb-3">
                    Register &rarr;
                </button>
                <div class="text-center">
                    <span class="text-muted small">Already have an account?</span> 
                    <a href="/login" class="text-success text-decoration-none small fw-bold">Login here</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
